name: Vacancy search every three hours
on:
  schedule:
    # Every 3 hours, independently of Render sleep; off the busy hour boundary.
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobpilot-daily-search
  cancel-in-progress: false
jobs:
  search:
    if: vars.JOBPILOT_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_EMAIL: ${{ vars.NOTIFICATION_EMAIL }}
      NOTIFICATION_FROM: ${{ vars.NOTIFICATION_FROM || 'JobPilot <onboarding@resend.dev>' }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      STORE_RESUME_FILES_IN_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.runtime.lock
      - run: pip install -r backend/requirements.runtime.lock && pip install --no-deps -e backend
      - name: Search vacancies and queue reports
        run: python scripts/run_cloud_searches.py
      - name: Deliver vacancies and reports even when a search fails
        if: ${{ !cancelled() }}
        run: python scripts/dispatch_cloud_notifications.py
