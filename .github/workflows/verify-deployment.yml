name: Verify VPS deployment
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vps-deployment-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for VPS deployment of verified revision
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          expected=os.environ["EXPECTED_COMMIT"]
          for attempt in range(72):
              try:
                  with urllib.request.urlopen("https://jobs.blyadota.dev/health",timeout=15) as response:
                      value=json.load(response)
                  if value.get("status")=="ready" and value.get("commit")==expected:
                      print("Verified VPS revision",expected)
                      break
              except Exception:
                  pass
              time.sleep(15)
          else:
              raise SystemExit("VPS has not reached the verified revision")
          PY
