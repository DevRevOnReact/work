name: Verify deployment and Telegram
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobpilot-deployment-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && !contains(github.event.workflow_run.head_commit.message, '[skip render]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.runtime.lock
      - run: python scripts/verify_release.py
