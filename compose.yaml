name: jobpilot
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jobpilot
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30, -c, work_mem=4MB]
    volumes:
      - postgres:/var/lib/postgresql/data
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U jobpilot"]
      interval: 30s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: ./backend
      target: automation
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://jobpilot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/jobpilot
      DATA_DIR: /data
      AUTH_REQUIRED: "false"
      EMBEDDED_SEARCHES: "true"
      APPLICATION_BROWSER_HEADLESS: "true"
    # One API process owns the queue and three-hour scheduler.
    command: [sh, -c, "alembic upgrade head && exec uvicorn jobpilot.api:app --host 0.0.0.0 --port 8000 --workers 1"]
    volumes:
      - artifacts:/data
    mem_limit: 1024m
    cpus: 1.0
    init: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
      APP_ORIGIN: ${APP_ORIGIN:-}
      NODE_OPTIONS: --max-old-space-size=192
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 320m
    cpus: 0.5
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres:
  artifacts:
