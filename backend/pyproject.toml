[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "beautifulsoup4>=4.12,<5",
  "rapidfuzz>=3.11,<4", "structlog>=25,<27", "pypdf>=6.19.0,<7"
]
[project.optional-dependencies]
automation = ["celery[redis]>=5.4,<6", "playwright>=1.51,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<2"]
[tool.setuptools.packages.find]
include = ["jobpilot*"]

[tool.setuptools.package-data]
jobpilot = ["starter_catalog.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
