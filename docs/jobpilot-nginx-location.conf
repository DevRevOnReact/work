# Inside the HTTPS server block for jobs.blyadota.dev.
# The app enforces its own HTTP Basic login.
auth_basic off;
client_max_body_size 12m;

location / {
    # For nginx in a Docker container. Native host nginx can also use
    # http://127.0.0.1:10000 instead.
    proxy_pass http://172.17.0.1:10001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
